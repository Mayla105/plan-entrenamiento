<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plan de Entrenamiento</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Plan">
<meta name="theme-color" content="#0f0f0f">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f0f0f'/%3E%3Ctext x='90' y='115' font-size='90' text-anchor='middle'%3E🏋️%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --green: #b8f04a;
    --yellow: #f5c842;
    --blue: #7eb8f7;
    --purple: #c084fc;
    --orange: #fb923c;
    --text: #e8e8e8;
    --text2: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 40px);
    padding-top: max(env(safe-area-inset-top), 32px);
  }

  .home-header {
    padding: 0 0 28px;
  }
  .home-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1;
  }
  .home-header p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 5px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 10px;
  }

  .plan-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .plan-card {
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px 16px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .plan-card:active { opacity: 0.6; }

  .card-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-info {
    flex: 1;
    min-width: 0;
  }
  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1.5px;
    line-height: 1;
    margin-bottom: 3px;
  }
  .card-sub {
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-arrow {
    color: #444;
    font-size: 14px;
    flex-shrink: 0;
  }

  .card-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 20px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="home-header">
  <h1>Plan de Entrenamiento</h1>
  <p>Maylene · 2026</p>
</div>

<div class="section-label">Planes activos</div>
<div class="plan-list">

  <a href="2t.html" class="plan-card" style="border-color:rgba(126,184,247,0.3);">
    <div class="card-dot" style="background:#7eb8f7"></div>
    <div class="card-info">
      <div class="card-name" style="color:#7eb8f7">2T</div>
      <div class="card-sub">Segundo Trimestre · Jul – Nov 2026</div>
    </div>
    <span class="card-badge" style="background:rgba(126,184,247,0.12);color:#7eb8f7">Activo</span>
    <div class="card-arrow">→</div>
  </a>

  <a href="black-week.html" class="plan-card" style="border-color:rgba(192,132,252,0.25);">
    <div class="card-dot" style="background:#c084fc"></div>
    <div class="card-info">
      <div class="card-name" style="color:#c084fc">Black Week</div>
      <div class="card-sub">Ciclo 4 2026 · BWP</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

</div>

<div class="section-label" style="margin-top:28px">Planes anteriores</div>
<div class="plan-list">

  <a href="bloque-prep.html" class="plan-card" style="border-color:rgba(245,200,66,0.2);">
    <div class="card-dot" style="background:#f5c842"></div>
    <div class="card-info">
      <div class="card-name" style="color:#f5c842">Bloque Prep</div>
      <div class="card-sub">6 de Junio 2026</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

  <a href="bwp.html" class="plan-card" style="border-color:rgba(184,240,74,0.2);">
    <div class="card-dot" style="background:#b8f04a"></div>
    <div class="card-info">
      <div class="card-name" style="color:#b8f04a">BWP</div>
      <div class="card-sub">Plan Semanal · 9 Mayo → 13 Junio</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

</div>

</body>
</html>
