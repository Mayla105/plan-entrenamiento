<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2T · Plan de Entrenamiento</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #222222;
    --border: #2a2a2a;
    --green: #b8f04a;
    --yellow: #f5c842;
    --red: #ff5f5f;
    --blue: #7eb8f7;
    --purple: #c084fc;
    --orange: #f97316;
    --muted: #555;
    --text: #e8e8e8;
    --text2: #999;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(env(safe-area-inset-bottom) + 32px);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent;
  }

  .top-bar { padding: 20px 28px 0; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.15s;
  }
  .back-btn:hover { color: var(--blue); }
  .back-btn span { font-size: 14px; }

  .header {
    padding: 20px 28px 24px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 8vw, 60px);
    letter-spacing: 2px;
    color: var(--blue);
    line-height: 1;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text2);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Day buttons */
  .day-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; cursor: pointer; text-align: left; transition: .15s;
    display: flex; align-items: center; gap: 11px; width: 100%;
    position: relative; overflow: hidden; user-select: none; font-family: inherit;
  }
  .day-btn::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition:background .2s; }
  .day-btn:active { background: var(--surface2); }
  .day-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .day-btn-info { flex: 1; min-width: 0; }
  .day-btn-name { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; color: var(--text); line-height: 1; margin-bottom: 1px; }
  .day-btn-sub { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .load-pips { display: flex; gap: 2px; flex-shrink: 0; }
  .pip { width: 6px; height: 6px; border-radius: 1px; background: var(--border); }
  .pip.on-high { background: var(--red); }
  .pip.on-med  { background: var(--yellow); }
  .pip.on-low  { background: var(--green); }

  /* BWP state classes */
  .bwp-mes-active { background: var(--surface2) !important; border-color: #333 !important; }
  .bwp-mes-active::before { background: var(--green) !important; }
  .bwp-sem-active { background: rgba(184,240,74,.08) !important; border-color: rgba(184,240,74,.25) !important; color: var(--green) !important; }
  .bwp-day-active { background: var(--surface2) !important; border-color: #444 !important; }
  .bwp-day-active::before { background: var(--green) !important; }
  .bwp-day-placeholder { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); font-size: 12px; }

  /* BWP sidebar styles */
  .bwp-mes-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; cursor: pointer; text-align: left; transition: .15s;
    display: flex; align-items: center; gap: 11px; width: 100%;
    position: relative; overflow: hidden; user-select: none; margin-bottom: 5px;
  }
  .bwp-mes-btn::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition:background .2s; }
  .bwp-sem-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 11px; font-weight: 700; color: var(--text2);
    cursor: pointer; font-family: inherit; transition: .15s; display: block;
    width: 100%; text-align: left; margin-bottom: 4px; user-select: none;
  }
  .bwp-sem-empty { opacity: .35; pointer-events: none; }

  /* WOD / skill / pump blocks */
  .wod-block { background: rgba(126,184,247,.06); border: 1px solid rgba(126,184,247,.2); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .wod-block summary { list-style: none; padding: 13px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .wod-block summary::-webkit-details-marker { display: none; }
  .wod-block .block-chevron { color: var(--blue); opacity: .6; transition: transform .2s; }
  .wod-block[open] .block-chevron { transform: rotate(180deg); }
  .wod-block[open] summary { border-bottom: 1px solid rgba(126,184,247,.15); }
  .wod-body { padding: 12px 16px 14px; font-size: 13px; color: var(--text2); line-height: 1.7; }
  .wod-body strong { color: var(--blue); }
  .skill-block { background: rgba(192,132,252,.06); border: 1px solid rgba(192,132,252,.2); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .skill-block summary { list-style: none; padding: 13px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .skill-block summary::-webkit-details-marker { display: none; }
  .skill-block .block-chevron { color: var(--purple); opacity: .6; transition: transform .2s; }
  .skill-block[open] .block-chevron { transform: rotate(180deg); }
  .skill-block[open] summary { border-bottom: 1px solid rgba(192,132,252,.15); }
  .pump-block { background: rgba(245,166,35,.06); border: 1px solid rgba(245,166,35,.2); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .pump-block summary { list-style: none; padding: 13px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .pump-block summary::-webkit-details-marker { display: none; }
  .pump-block .block-chevron { color: var(--orange); opacity: .6; transition: transform .2s; }
  .pump-block[open] .block-chevron { transform: rotate(180deg); }
  .pump-block[open] summary { border-bottom: 1px solid rgba(245,166,35,.15); }

  /* Tags */
  .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; padding: 3px 8px; border-radius: 4px; }
  .tag-oly      { background: rgba(126,184,247,.12); color: var(--blue); }
  .tag-bwp      { background: rgba(184,240,74,.15);  color: var(--green); }
  .tag-skills   { background: rgba(192,132,252,.12); color: var(--purple); }
  .tag-pump     { background: rgba(245,166,35,.12);  color: var(--orange); }
  .tag-endurance{ background: rgba(126,184,247,.12); color: var(--blue); }

  /* Plan header */
  .plan-header { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .plan-day-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
  .plan-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; line-height: 1; margin-bottom: 8px; color: var(--text); }
  .plan-tags { display: flex; flex-wrap: wrap; gap: 5px; }

  /* Block base */
  details.block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 10px; overflow: hidden;
  }
  details summary {
    padding: 13px 16px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none; list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::marker { display: none; }
  details[open] > summary .block-chevron { transform: rotate(180deg); }
  .block-icon     { font-size: 15px; flex-shrink: 0; }
  .block-title    { font-weight: 600; font-size: 13.5px; color: var(--text); flex: 1; }
  .block-subtitle { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .block-chevron  { color: var(--muted); font-size: 10px; transition: transform 0.2s; flex-shrink: 0; }
  .block-body { border-top: 1px solid var(--border); }

  /* Exercises */
  .ex-group { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.04); }
  .ex-group:last-child { border-bottom: none; }
  .ex-group-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .ex-item { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.03); }
  .ex-item:last-child { border-bottom: none; }
  .ex-bullet { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); flex-shrink: 0; margin-top: 7px; }
  .ex-name   { font-size: 13px; color: var(--text); font-weight: 500; flex: 1; }
  .ex-detail { font-size: 11px; color: var(--text2); text-align: right; flex-shrink: 0; max-width: 55%; }
  .ex-note   { font-size: 11px; color: var(--muted); font-style: italic; padding: 2px 0 4px 12px; }
  .sub-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 10px 16px 2px; }

  /* Complex */
  .complex-wrap { padding: 12px 16px; }
  .complex-list { display: flex; flex-direction: column; gap: 5px; }
  .c-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); border-radius: 7px; }
  .c-item-name { font-size: 12px; color: var(--text); font-weight: 600; flex-shrink: 0; }
  .c-item-reps { font-size: 12px; font-weight: 700; text-align: right; }
  .c-item-kg { color: inherit; font-weight: 700; }

  /* RM Calculator */
  .rm-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; margin: 0 0 4px; }
  .rm-bar label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  .rm-bar input { width: 80px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; font-weight: 700; padding: 6px 8px; text-align: center; }
  .rm-bar input:focus { outline: none; border-color: var(--green); }
  .rm-bar .rm-clear { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; }
  .rm-bar .rm-clear:hover { color: var(--text); }

  /* Notes */
  .note-box { margin: 0 16px 12px; background: rgba(184,240,74,.04); border: 1px solid rgba(184,240,74,.12); border-radius: 7px; padding: 10px 13px; font-size: 12px; color: var(--text2); line-height: 1.65; }
  .note-box strong { color: var(--green); }
  .note-warn { background: rgba(245,200,66,.04); border-color: rgba(245,200,66,.15); }
  .note-warn strong { color: var(--yellow); }
  .note-red { background: rgba(255,95,95,.04); border-color: rgba(255,95,95,.15); }
  .note-red strong { color: var(--red); }

  /* Ciclo dropdown */
  .ciclo-dropdown { position: relative; width: 100%; margin-bottom: 12px; }
  .ciclo-dropdown-btn {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 10px; font-family: inherit;
    transition: .15s; user-select: none; position: relative;
  }
  .ciclo-dropdown-btn:hover, .ciclo-dropdown-btn.open { background: var(--surface2); border-color: #333; }
  .ciclo-dropdown-btn::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--green); border-radius:10px 0 0 10px; }
  .ciclo-chevron { margin-left: auto; color: var(--muted); font-size: 10px; transition: transform .2s; flex-shrink: 0; }
  .ciclo-dropdown-btn.open .ciclo-chevron { transform: rotate(180deg); }
  .ciclo-dropdown-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .ciclo-dropdown-panel.open { display: block; }
  .ciclo-option {
    width: 100%; background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 11px 14px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; font-family: inherit; text-align: left; transition: background .12s;
  }
  .ciclo-option:last-child { border-bottom: none; }
  .ciclo-option:hover { background: rgba(255,255,255,.04); }
  .ciclo-option.active { background: rgba(184,240,74,.08); }
  .ciclo-option .day-btn-name { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:var(--text); line-height:1; margin-bottom:1px; }
  .ciclo-option .day-btn-sub { font-size:11px; color:var(--text2); }

  /* BWP grid */
  .bwp-wrap { padding: 24px 28px; }
  .bwp-grid { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
  .bwp-sidebar-aside { position: sticky; top: 24px; }

  @media (max-width: 700px) {
    .bwp-wrap { padding: 16px; }
    .bwp-grid { grid-template-columns: 1fr; gap: 12px; }
    .bwp-sidebar-aside { position: static; }
    #bwp-sem-btns { flex-direction: column !important; }
    #bwp-day-btns .day-btn { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn"><span>←</span> Plan de entrenamiento</a>
</div>

<div class="header">
  <h1>2T</h1>
  <p class="subtitle">Segundo Trimestre · 2026</p>
</div>

<div class="bwp-wrap">
  <div class="bwp-grid">
    <aside class="bwp-sidebar-aside">
      <div id="bwp-mes-list"></div>
    </aside>
    <div>
      <div id="bwp-sem-header" style="display:none; margin-bottom:12px;">
        <div id="bwp-sem-btns" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;"></div>
        <div id="bwp-day-btns" style="display:flex; flex-direction:column; gap:5px; margin-bottom:16px;"></div>
        <div id="bwp-day-placeholder" class="bwp-day-placeholder" style="display:block;">Seleccioná un día para ver la planificación</div>
        <div id="bwp-day-content"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Datos de navegación 2T ──
const BWP = {
  ciclos: [
    {
      id: 'c1', label: 'Ciclo 1', sub: 'Próximamente',
      semanas: [
        { id: 'c1s1', label: 'Semana 1', rango: 'Por definir', vacia: true, dias: [] }
      ]
    }
  ]
};

// Estado — arranca siempre en el último ciclo y última semana cargados
const ultimoCiclo = BWP.ciclos[BWP.ciclos.length - 1];
let activeMes = ultimoCiclo.id;
let activeSem = ultimoCiclo.semanas[ultimoCiclo.semanas.length - 1].id;
let activeDay = null;

// ── Render sidebar ciclos (dropdown) ──
function renderMeses() {
  const list = document.getElementById('bwp-mes-list');
  const cicloActivo = BWP.ciclos.find(c => c.id === activeMes);
  list.innerHTML = `
    <div class="ciclo-dropdown" id="ciclo-dropdown">
      <button class="ciclo-dropdown-btn" id="ciclo-dropdown-btn" onclick="toggleCicloDropdown(event)">
        <div class="day-dot" style="background:var(--blue); flex-shrink:0;"></div>
        <div class="day-btn-info">
          <div class="day-btn-name">${cicloActivo ? cicloActivo.label : '—'}</div>
          <div class="day-btn-sub">${cicloActivo ? cicloActivo.sub : ''}</div>
        </div>
        <span class="ciclo-chevron">▼</span>
      </button>
      <div class="ciclo-dropdown-panel" id="ciclo-dropdown-panel">
        ${BWP.ciclos.map(ciclo => `
          <button class="ciclo-option ${ciclo.id === activeMes ? 'active' : ''}"
            onclick="selectCiclo('${ciclo.id}', event)">
            <div class="day-dot" style="background:var(--blue); flex-shrink:0;"></div>
            <div class="day-btn-info">
              <div class="day-btn-name">${ciclo.label}</div>
              <div class="day-btn-sub">${ciclo.sub}</div>
            </div>
          </button>`).join('')}
      </div>
    </div>`;
}

function toggleCicloDropdown(e) {
  if (e) e.stopPropagation();
  const btn = document.getElementById('ciclo-dropdown-btn');
  const panel = document.getElementById('ciclo-dropdown-panel');
  if (!btn || !panel) return;
  const isOpen = panel.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  panel.classList.toggle('open', !isOpen);
}

function selectCiclo(id, e) {
  if (e) e.stopPropagation();
  activeMes = id;
  const ciclo = BWP.ciclos.find(c => c.id === id);
  activeSem = ciclo.semanas[0].id;
  activeDay = null;
  const btn = document.getElementById('ciclo-dropdown-btn');
  const panel = document.getElementById('ciclo-dropdown-panel');
  if (btn) btn.classList.remove('open');
  if (panel) panel.classList.remove('open');
  render();
}

document.addEventListener('click', function() {
  const btn = document.getElementById('ciclo-dropdown-btn');
  const panel = document.getElementById('ciclo-dropdown-panel');
  if (btn) btn.classList.remove('open');
  if (panel) panel.classList.remove('open');
});

// ── Render semanas y días ──
function renderContent() {
  const mes = BWP.ciclos.find(m => m.id === activeMes);
  if (!mes) return;

  const semHeader = document.getElementById('bwp-sem-header');
  semHeader.style.display = 'block';

  // Botones de semanas
  const semBtns = document.getElementById('bwp-sem-btns');
  semBtns.innerHTML = '';
  mes.semanas.forEach(sem => {
    const btn = document.createElement('button');
    btn.className = 'bwp-sem-btn' + (sem.vacia ? ' bwp-sem-empty' : '') + (activeSem === sem.id ? ' bwp-sem-active' : '');
    btn.textContent = `${sem.label} · ${sem.rango}`;
    if (!sem.vacia) {
      btn.onclick = () => { activeSem = sem.id; activeDay = null; render(); };
    }
    semBtns.appendChild(btn);
  });

  const sem = mes.semanas.find(s => s.id === activeSem);
  const dayBtns = document.getElementById('bwp-day-btns');
  const placeholder = document.getElementById('bwp-day-placeholder');
  const dayContent = document.getElementById('bwp-day-content');
  dayBtns.innerHTML = '';
  dayContent.innerHTML = '';

  if (!sem || sem.vacia) {
    placeholder.style.display = 'block';
    placeholder.innerHTML = 'El contenido se agregará cuando esté disponible.';
    return;
  }

  // Botones de días
  sem.dias.forEach(dia => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (activeDay === dia.id ? ' bwp-day-active' : '');
    const pips = dia.carga === 'high'
      ? '<div class="pip on-high"></div><div class="pip on-high"></div><div class="pip on-high"></div>'
      : dia.carga === 'high-med'
      ? '<div class="pip on-high"></div><div class="pip on-high"></div><div class="pip on-med"></div>'
      : dia.carga === 'off'
      ? '<div class="pip"></div><div class="pip"></div><div class="pip"></div>'
      : '<div class="pip on-med"></div><div class="pip on-med"></div><div class="pip on-med"></div>';
    btn.innerHTML = `
      <div class="day-dot" style="background:var(--blue);"></div>
      <div class="day-btn-info">
        <div class="day-btn-name">${dia.label}</div>
        <div class="day-btn-sub">${dia.sub}</div>
      </div>
      <div class="load-pips">${pips}</div>`;
    btn.onclick = () => { activeDay = dia.id; render(); };
    dayBtns.appendChild(btn);
  });

  // Contenido del día
  if (!activeDay) {
    placeholder.style.display = 'block';
    placeholder.innerHTML = 'Seleccioná un día para ver la planificación';
    return;
  }

  placeholder.style.display = 'none';
  const dia = sem.dias.find(d => d.id === activeDay);
  if (dia) {
    const tpl = document.getElementById(dia.contenido);
    if (tpl) {
      dayContent.innerHTML = tpl.innerHTML;
      initRMCalculators(dayContent);
    }
  }
}

// ── Calculadora de RM: agrega un campo de RM en cada bloque con % y muestra los kg ──
function initRMCalculators(container) {
  const wraps = container.querySelectorAll('.complex-wrap');
  wraps.forEach(wrap => {
    const items = wrap.querySelectorAll('.c-item-reps');
    let hasPct = false;
    items.forEach(el => { if (/\d+([.,]\d+)?%/.test(el.textContent)) hasPct = true; });
    if (!hasPct) return;

    items.forEach(el => { if (!el.dataset.orig) el.dataset.orig = el.textContent; });

    const block = wrap.closest('details');
    const titleEl = block ? block.querySelector('.block-title') : null;
    const title = titleEl ? titleEl.textContent.trim() : 'RM';
    const key = 'rm_' + title.replace(/\s+/g, '_');

    const bar = document.createElement('div');
    bar.className = 'rm-bar';
    bar.innerHTML = `<label>RM (kg)</label><input type="number" step="0.5" min="0" placeholder="0" class="rm-input"><button type="button" class="rm-clear">borrar</button>`;
    wrap.parentElement.insertBefore(bar, wrap);

    const input = bar.querySelector('.rm-input');
    const clearBtn = bar.querySelector('.rm-clear');

    const saved = localStorage.getItem(key);
    if (saved) { input.value = saved; applyRM(items, saved); }

    input.addEventListener('input', () => {
      if (input.value) localStorage.setItem(key, input.value); else localStorage.removeItem(key);
      applyRM(items, input.value);
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      localStorage.removeItem(key);
      applyRM(items, '');
    });
  });
}

function applyRM(items, rmStr) {
  const rm = parseFloat(rmStr);
  items.forEach(el => {
    const orig = el.dataset.orig;
    if (!rm || rm <= 0) { el.innerHTML = orig; return; }
    el.innerHTML = orig.replace(/(\d+(?:[.,]\d+)?)%/g, (m, pctStr) => {
      const pct = parseFloat(pctStr.replace(',', '.'));
      const kg = Math.round((rm * pct / 100) * 2) / 2;
      return `${m} <span class="c-item-kg">(${kg}kg)</span>`;
    });
  });
}

function render() {
  renderMeses();
  renderContent();
  document.querySelectorAll('.bwp-mes-btn').forEach(b => b.classList.remove('bwp-mes-active'));
  document.querySelectorAll('.bwp-mes-btn').forEach((b, i) => {
    if (BWP.ciclos[i] && BWP.ciclos[i].id === activeMes) b.classList.add('bwp-mes-active');
  });
}

window.addEventListener('DOMContentLoaded', () => {
  render();
});
</script>
</body>
</html>
